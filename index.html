<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리집 가계부</title>
<meta name="theme-color" content="#F6F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16171A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="가계부">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#F6F5F2; --card:#FFFFFF; --ink:#1B1C1F; --sub:#6B6E76; --line:#E6E4DF;
  --accent:#3E63DD; --accent-ink:#fff; --danger:#D93D42; --good:#1E8E5A; --chip:#EFEEEA;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
  --r:16px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#16171A;--card:#202226;--ink:#EDEDEF;--sub:#9A9CA3;--line:#2E3036;--accent:#7B93F5;--accent-ink:#0F1220;--chip:#2A2C31;--shadow:none;--danger:#F2686C;--good:#4CC38A}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
  font-size:16px;line-height:1.45;padding-bottom:calc(84px + env(safe-area-inset-bottom));min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit;font-size:16px;color:var(--ink)}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px 96px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.month-nav{display:flex;align-items:center;gap:4px}
.month-nav b{font-size:20px;letter-spacing:-.02em;min-width:118px;text-align:center}
.ibtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--sub)}
.ibtn:active{background:var(--chip)}
.hh{font-size:13px;color:var(--sub);max-width:40%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
.summary{padding:20px 20px 18px;margin-bottom:12px}
.summary .label{font-size:13px;color:var(--sub)}
.summary .total{font-size:34px;font-weight:700;letter-spacing:-.03em;margin:2px 0 6px}
.delta{font-size:13px;color:var(--sub)}
.delta .up{color:var(--danger)} .delta .down{color:var(--good)}
.stackbar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--chip);margin-top:14px}
.stackbar i{display:block;height:100%}

.sortbar{display:flex;align-items:center;justify-content:space-between;margin:2px 4px 10px;font-size:13px;color:var(--sub)}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{padding:5px 12px;border-radius:8px;font-size:13px;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.banner button{color:var(--accent);font-weight:600;white-space:nowrap}

.cat{margin-bottom:8px;overflow:hidden}
.cat-head{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;text-align:left}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.cat-name{flex:1;font-weight:600;display:flex;align-items:center;gap:6px;min-width:0}
.cat-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-style:normal;font-size:11px;font-weight:600;color:var(--sub);background:var(--chip);padding:1px 6px;border-radius:6px;flex:none}
.cat-sum{font-weight:600}
.cat-sum.zero{color:var(--sub);font-weight:400}
.chev{color:var(--sub);transition:transform .15s}
.open .chev{transform:rotate(90deg)}
.cat-body{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;padding:11px 16px;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--line)}
.row .m{flex:1;min-width:0}
.row .m div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m small{color:var(--sub);font-size:12px}
.row:active{background:var(--chip)}
.add-in{color:var(--accent);font-weight:600;font-size:14px;padding:12px 16px;width:100%;text-align:left;border-top:1px solid var(--line)}
.empty{color:var(--sub);font-size:14px;padding:12px 16px}

/* trend */
.chart{padding:18px 16px 12px;margin-bottom:12px}
.bars{display:flex;align-items:flex-end;gap:10px;height:180px;margin-top:8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar .stack{width:100%;max-width:38px;display:flex;flex-direction:column-reverse;border-radius:8px;overflow:hidden;background:var(--chip);min-height:2px}
.bar small{font-size:12px;color:var(--sub)}
.bar.cur small{color:var(--ink);font-weight:700}
.bar .v{font-size:11px;color:var(--sub)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:14px;font-size:12px;color:var(--sub)}
.legend span{display:inline-flex;align-items:center;gap:5px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:11px 16px;text-align:right}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--sub);font-weight:500}
tr+tr td{border-top:1px solid var(--line)}

/* settings */
.sec{font-size:13px;color:var(--sub);margin:20px 4px 8px;font-weight:600}
.srow{display:flex;align-items:center;gap:12px;padding:13px 16px;width:100%;text-align:left}
.srow+.srow{border-top:1px solid var(--line)}
.srow .grow{flex:1;min-width:0}
.srow .val{color:var(--sub);font-size:14px}
.code{font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:.12em;font-size:18px}
.mini{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--sub)}
.mini:active{background:var(--chip)}
.mini:disabled{opacity:.25}
.link{color:var(--accent);font-weight:600}
.danger{color:var(--danger)}
.note{font-size:13px;color:var(--sub);padding:0 4px;margin:8px 0}

/* tabbar + fab */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:5}
.tabbar .in{display:flex;max-width:560px;width:100%}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--sub);padding:4px 0}
.tab.on{color:var(--ink);font-weight:600}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;
  background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 20px rgba(62,99,221,.35);z-index:6}
.fab:active{transform:scale(.96)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:20px 20px 0 0;max-width:560px;margin:0 auto;
  padding:10px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .22s ease;max-height:92vh;overflow:auto}
.sheet.show{transform:none}
.grab{width:36px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 14px;font-size:18px}
.field{margin-bottom:14px}
.field>label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
.inp{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);outline:none}
.inp:focus{border-color:var(--accent)}
.amount{font-size:28px;font-weight:700;text-align:right;padding:10px 14px}
.quick{display:flex;gap:6px;margin-top:8px}
.quick button{flex:1;padding:8px 0;border-radius:10px;background:var(--chip);font-size:13px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:99px;background:var(--chip);font-size:14px;display:inline-flex;align-items:center;gap:6px;border:1.5px solid transparent}
.chip.on{border-color:var(--ink);font-weight:600}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid transparent;outline:2px solid transparent}
.sw.on{border-color:var(--card);outline-color:var(--ink)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.toggle small{display:block;color:var(--sub);font-size:12px}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.actions{display:flex;gap:8px;margin-top:6px}
.btn{flex:1;padding:14px;border-radius:14px;font-weight:700;background:var(--chip)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.del{flex:0 0 auto;padding:14px 18px;color:var(--danger)}
.btn:disabled{opacity:.5}

/* auth */
.auth{max-width:400px;margin:8vh auto 0;padding:0 20px}
.auth h1{font-size:26px;letter-spacing:-.03em;margin:0 0 4px}
.auth p{color:var(--sub);margin:0 0 24px;font-size:14px}
.auth .card{padding:18px;margin-bottom:12px}
.auth h2{font-size:16px;margin:0 0 12px}
.err{color:var(--danger);font-size:13px;min-height:18px;margin:4px 0}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:18px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.choice span{flex:1}
.choice b{display:block;font-size:17px;margin-bottom:2px}
.choice small{color:var(--sub);font-size:13px}
.choice svg{color:var(--sub);flex:none}
.choice:active{transform:scale(.99);background:var(--chip)}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--sub);font-size:14px;margin:0 0 18px -6px;padding:6px}
.divider{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:12px;margin:26px 0 12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.2s;z-index:40;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.demo-tag{font-size:11px;font-weight:700;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);padding:2px 7px;border-radius:6px;margin-left:6px}
.loading{text-align:center;color:var(--sub);padding:30vh 0}
</style>
</head>
<body>
<div id="app"><div class="loading">불러오는 중…</div></div>
<div class="toast" id="toast"></div>

<script type="module">
/* ───────── 설정 ───────── */
let CONFIG = {};
try { CONFIG = (await import('./config.js')).default || {}; } catch (_) {}

const DEFAULT_CATS = [
  { name: '고정지출', color: '#3E63DD', is_fixed: true },
  { name: '교통비',   color: '#12A594', is_fixed: false },
  { name: '유류비',   color: '#F76B15', is_fixed: false },
  { name: '식비',     color: '#E5484D', is_fixed: false },
  { name: '기타 소비', color: '#8E8C99', is_fixed: false },
];
const SWATCHES = ['#3E63DD','#12A594','#F76B15','#E5484D','#8E8C99','#8E4EC6','#D6409F','#FFB224','#0090FF','#46A758','#AD7F58','#1B1C1F'];

/* ───────── 유틸 ───────── */
const $ = s => document.querySelector(s);
const won = n => (Number(n) || 0).toLocaleString('ko-KR') + '원';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ym = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
const addMonth = (m, k) => { const [y, mo] = m.split('-').map(Number); return ym(new Date(y, mo - 1 + k, 1)); };
const monthLabel = m => { const [y, mo] = m.split('-'); return `${y}년 ${+mo}월`; };
const shortMonth = m => `${+m.split('-')[1]}월`;
const today = () => { const d = new Date(); return `${ym(d)}-${String(d.getDate()).padStart(2, '0')}`; };
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const sum = arr => arr.reduce((a, e) => a + (Number(e.amount) || 0), 0);
const compact = n => n >= 10000 ? (Math.round(n / 1000) / 10).toLocaleString('ko-KR') + '만' : n.toLocaleString('ko-KR');
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }
const ICON = {
  left: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  right:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
  chev: '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
  plus: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  up:   '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>',
  down: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  tMonth:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>',
  tTrend:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-9"/></svg>',
  tSet: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
};

/* ───────── 데모 저장소 (Supabase 미설정 시, 이 기기에만 저장) ───────── */
function makeLocalStore() {
  const KEY = 'family-budget-demo-v1';
  let db = null;
  try { db = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (_) {}
  const fresh = (withSample) => {
    const cats = DEFAULT_CATS.map((c, i) => ({ id: uid(), sort_order: i, ...c }));
    const d = { household: { name: '우리집', invite_code: 'DEMO' }, categories: cats, entries: [] };
    if (withSample) {
      const m0 = ym(new Date());
      const sample = [
        [0, '관리비', 238000], [0, '통신비', 109000], [0, '보험료', 186000], [0, '주담대 이자', 812000],
        [1, '교통카드', 0], [2, '주유', 0], [3, '장보기', 0], [3, '외식', 0], [4, '생활용품', 0],
      ];
      for (let k = -4; k <= 0; k++) {
        const m = addMonth(m0, k);
        for (const [ci, memo, fixed] of sample) {
          const amt = fixed || Math.round((40000 + Math.random() * 260000) / 1000) * 1000;
          d.entries.push({ id: uid(), category_id: cats[ci].id, month: m, amount: amt, memo, spent_on: null, created_at: new Date().toISOString() });
        }
      }
    }
    return d;
  };
  if (!db) db = fresh(true);
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (_) {} };
  save();
  return {
    mode: 'demo',
    async household() { return db.household; },
    async members() { return [{ display_name: '이 기기' }]; },
    async categories() { return [...db.categories].sort((a, b) => a.sort_order - b.sort_order); },
    async addCategory(c) { const n = { id: uid(), sort_order: Math.max(-1, ...db.categories.map(x => x.sort_order)) + 1, ...c }; db.categories.push(n); save(); return n; },
    async updateCategory(id, p) { Object.assign(db.categories.find(c => c.id === id) || {}, p); save(); },
    async deleteCategory(id) { db.categories = db.categories.filter(c => c.id !== id); db.entries = db.entries.filter(e => e.category_id !== id); save(); },
    async entries(from, to) { return db.entries.filter(e => e.month >= from && e.month <= to).map(e => ({ ...e })); },
    async addEntry(e) { const n = { id: uid(), created_at: new Date().toISOString(), ...e }; db.entries.push(n); save(); return { ...n }; },
    async addEntries(list) { const out = []; for (const e of list) out.push(await this.addEntry(e)); return out; },
    async updateEntry(id, p) { const e = db.entries.find(x => x.id === id); Object.assign(e || {}, p); save(); return e && { ...e }; },
    async deleteEntry(id) { db.entries = db.entries.filter(e => e.id !== id); save(); },
    async renameHousehold(name) { db.household.name = name; save(); },
    subscribe() { return () => {}; },
    async reset() { db = fresh(false); save(); },
  };
}

/* ───────── Supabase 저장소 (둘이 공유) ───────── */
function makeCloudStore(sb, hid) {
  const ok = ({ data, error }) => { if (error) throw error; return data; };
  return {
    mode: 'cloud',
    async household() { return ok(await sb.from('households').select('name,invite_code').eq('id', hid).single()); },
    async members() { return ok(await sb.from('members').select('display_name,user_id').eq('household_id', hid)); },
    async categories() { return ok(await sb.from('categories').select('*').eq('household_id', hid).order('sort_order')); },
    async addCategory(c) {
      const max = Math.max(-1, ...S.cats.map(x => x.sort_order));
      return ok(await sb.from('categories').insert({ sort_order: max + 1, ...c, household_id: hid }).select().single());
    },
    async updateCategory(id, p) { ok(await sb.from('categories').update(p).eq('id', id)); },
    async deleteCategory(id) { ok(await sb.from('categories').delete().eq('id', id)); },
    // light=true → 합계 계산에 필요한 컬럼만 받아서 전송량을 줄여요
    async entries(from, to, light = false) {
      return ok(await sb.from('entries').select(light ? 'id,month,category_id,amount,created_at' : '*')
        .eq('household_id', hid).gte('month', from).lte('month', to).order('created_at'));
    },
    async addEntry(e) { return ok(await sb.from('entries').insert({ ...e, household_id: hid }).select().single()); },
    async addEntries(list) { return ok(await sb.from('entries').insert(list.map(e => ({ ...e, household_id: hid }))).select()); },
    async updateEntry(id, p) { return ok(await sb.from('entries').update(p).eq('id', id).select().single()); },
    async deleteEntry(id) { ok(await sb.from('entries').delete().eq('id', id)); },
    async renameHousehold(name) { ok(await sb.from('households').update({ name }).eq('id', hid)); },
    // 바뀐 행만 받아서 반영 (전체 재조회 X). DELETE는 필터를 걸 수 없어 id로만 처리해요.
    subscribe(cb) {
      const f = { schema: 'public', filter: `household_id=eq.${hid}` };
      const ch = sb.channel('hh-' + hid)
        .on('postgres_changes', { event: 'INSERT', table: 'entries', ...f }, cb)
        .on('postgres_changes', { event: 'UPDATE', table: 'entries', ...f }, cb)
        .on('postgres_changes', { event: 'DELETE', table: 'entries', schema: 'public' }, cb)
        .on('postgres_changes', { event: '*', table: 'categories', ...f }, cb)
        .subscribe();
      return () => sb.removeChannel(ch);
    },
  };
}

/* ───────── 상태 ───────── */
const S = { store: null, sb: null, user: null, month: ym(new Date()), tab: 'month', cats: [], range: [], entries: [], hh: null, members: [], open: new Set(), sort: (() => { try { return localStorage.getItem('fb-sort') || 'date'; } catch (_) { return 'date'; } })() };

/* ───────── 부팅 / 로그인 ───────── */
async function boot() {
  if (!CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY) { S.store = makeLocalStore(); return start(); }
  try {
    const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    S.sb = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
    const { data: { session } } = await S.sb.auth.getSession();
    if (!session) return renderAuth();
    await afterLogin(session.user);
  } catch (e) {
    $('#app').innerHTML = `<div class="auth"><h1>연결 오류</h1><p>${esc(e.message || e)}</p><button class="btn primary" onclick="location.reload()">다시 시도</button></div>`;
  }
}

async function afterLogin(user) {
  S.user = user;
  const { data, error } = await S.sb.from('members').select('household_id').eq('user_id', user.id).limit(1);
  if (error) throw error;
  if (!data.length) return renderOnboard();
  S.store = makeCloudStore(S.sb, data[0].household_id);
  start();
}

const korErr = m => {
  const s = String(m || '');
  if (/Invalid login credentials/i.test(s)) return '이메일 또는 비밀번호가 맞지 않아요.';
  if (/already registered|already been registered/i.test(s)) return '이미 가입된 이메일이에요. 처음 화면에서 로그인을 눌러주세요.';
  if (/Email not confirmed/i.test(s)) return '메일 인증이 아직 안 됐어요. 받은 메일의 링크를 눌러주세요.';
  if (/Password should be/i.test(s)) return '비밀번호는 6자 이상이어야 해요.';
  if (/invalid.*email|Unable to validate email/i.test(s)) return '이메일 형식을 확인해주세요.';
  return s;
};
function authShell(inner) { $('#app').innerHTML = `<div class="auth">${inner}</div>`; window.scrollTo(0, 0); }
const bindNav = fn => document.querySelectorAll('[data-nav]').forEach(b => { b.onclick = () => fn(b.dataset.nav); });
const choiceButtons = `
  <div class="choices">
    <button class="choice" data-nav="create"><span><b>새 가계부 만들기</b><small>처음 시작하는 사람 · 만든 뒤 초대코드를 상대에게 보내요</small></span>${ICON.right}</button>
    <button class="choice" data-nav="join"><span><b>초대코드로 참여하기</b><small>상대에게 초대코드를 받은 사람</small></span>${ICON.right}</button>
  </div>`;

// 로그인 전: 처음 화면 → 로그인 / 새로 만들기 / 초대코드로 참여
function renderAuth(mode = 'home') {
  if (mode === 'home') {
    authShell(`
      <h1>우리집 가계부</h1>
      <p>둘이 같은 가계부를 함께 써요. 어떻게 시작할까요?</p>
      ${choiceButtons}
      <div class="divider"><span>이미 계정이 있다면</span></div>
      <button class="btn" style="width:100%" data-nav="login">로그인</button>`);
    return bindNav(m => renderAuth(m));
  }
  const isLogin = mode === 'login', isJoin = mode === 'join';
  authShell(`
    <button class="back" data-nav="home">${ICON.left}처음으로</button>
    <h1>${isLogin ? '로그인' : isJoin ? '초대코드로 참여' : '새 가계부 만들기'}</h1>
    <p>${isLogin ? '가입한 이메일과 비밀번호를 입력하세요.'
      : isJoin ? '받은 초대코드를 넣고 내 계정을 만들면 같은 가계부에 들어가요.'
      : '계정을 만들면 가계부가 함께 생겨요. 초대코드는 설정 탭에서 확인할 수 있어요.'}</p>
    <div class="card">
      ${isJoin ? `<div class="field"><label>초대코드</label><input class="inp code" id="code" autocapitalize="characters" autocomplete="off" placeholder="ABC123"></div>` : ''}
      ${mode === 'create' ? `<div class="field"><label>가계부 이름</label><input class="inp" id="hn" value="우리집"></div>` : ''}
      ${isLogin ? '' : `<div class="field"><label>내 이름 · 내역에 표시돼요</label><input class="inp" id="dn" placeholder="${isJoin ? '예: 아내' : '예: 남편'}"></div>`}
      <div class="field"><label>이메일</label><input class="inp" id="em" type="email" autocomplete="email" inputmode="email"></div>
      <div class="field"><label>비밀번호${isLogin ? '' : ' (6자 이상)'}</label><input class="inp" id="pw" type="password" autocomplete="${isLogin ? 'current-password' : 'new-password'}"></div>
      <div class="err" id="err"></div>
      <button class="btn primary" style="width:100%" id="go">${isLogin ? '로그인' : isJoin ? '가입하고 참여하기' : '가입하고 만들기'}</button>
    </div>`);
  bindNav(m => renderAuth(m));
  const err = m => { $('#err').textContent = m; };
  $('#go').onclick = async ev => {
    const email = $('#em').value.trim(), password = $('#pw').value;
    const code = $('#code')?.value.trim().toUpperCase(), name = $('#dn')?.value.trim(), hn = $('#hn')?.value.trim();
    err('');
    if (isJoin && !code) return err('초대코드를 입력하세요.');
    if (!isLogin && !name) return err('내 이름을 입력하세요.');
    if (!email || password.length < 6) return err('이메일과 6자 이상 비밀번호를 입력하세요.');
    ev.target.disabled = true;
    try {
      if (isLogin) {
        const { data, error } = await S.sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        return await afterLogin(data.session.user);
      }
      const { data, error } = await S.sb.auth.signUp({ email, password });
      if (error) throw error;
      if (!data.session) { ev.target.disabled = false; return err('가입 확인 메일을 보냈어요. 메일의 링크를 누른 뒤 로그인하세요.'); }
      S.user = data.session.user;
      const { error: e2 } = isJoin
        ? await S.sb.rpc('join_household', { p_code: code, p_display: name })
        : await S.sb.rpc('create_household', { p_name: hn || '우리집', p_display: name });
      // 가입은 됐는데 코드가 틀린 경우 → 로그인 상태로 다시 입력받기
      if (e2) return renderOnboard(isJoin ? 'join' : 'create', { err: e2.message, code, name });
      await afterLogin(S.user);
    } catch (e) { ev.target.disabled = false; err(korErr(e.message)); }
  };
}

// 로그인은 했지만 아직 가계부가 없을 때
function renderOnboard(mode = 'home', o = {}) {
  if (mode === 'home') {
    authShell(`
      <h1>가계부 연결</h1>
      <p>${esc(S.user?.email || '')} 계정에 연결된 가계부가 없어요.</p>
      ${choiceButtons}
      <p style="text-align:center;margin-top:20px"><button class="link" id="out">다른 계정으로 로그인</button></p>`);
    bindNav(m => renderOnboard(m));
    $('#out').onclick = async () => { await S.sb.auth.signOut(); renderAuth(); };
    return;
  }
  const isJoin = mode === 'join';
  authShell(`
    <button class="back" data-nav="home">${ICON.left}뒤로</button>
    <h1>${isJoin ? '초대코드로 참여' : '새 가계부 만들기'}</h1>
    <p>${isJoin ? '받은 초대코드를 입력하세요.' : '가계부 이름과 내 이름을 정하세요.'}</p>
    <div class="card">
      ${isJoin ? `<div class="field"><label>초대코드</label><input class="inp code" id="code" autocapitalize="characters" autocomplete="off" placeholder="ABC123" value="${esc(o.code || '')}"></div>`
               : `<div class="field"><label>가계부 이름</label><input class="inp" id="hn" value="우리집"></div>`}
      <div class="field"><label>내 이름 · 내역에 표시돼요</label><input class="inp" id="dn" value="${esc(o.name || '')}" placeholder="${isJoin ? '예: 아내' : '예: 남편'}"></div>
      <div class="err" id="err">${esc(o.err || '')}</div>
      <button class="btn primary" style="width:100%" id="go">${isJoin ? '참여하기' : '만들기'}</button>
    </div>`);
  bindNav(m => renderOnboard(m));
  $('#go').onclick = async ev => {
    const name = $('#dn').value.trim();
    if (!name) { $('#err').textContent = '내 이름을 입력하세요.'; return; }
    ev.target.disabled = true;
    const { error } = isJoin
      ? await S.sb.rpc('join_household', { p_code: $('#code').value.trim().toUpperCase(), p_display: name })
      : await S.sb.rpc('create_household', { p_name: $('#hn').value.trim() || '우리집', p_display: name });
    if (error) { ev.target.disabled = false; $('#err').textContent = error.message; return; }
    afterLogin(S.user);
  };
}

/* ───────── 데이터 캐시 ─────────
   한 번 받은 달은 메모리에 두고 재사용해요.
   state: 'full' = 메모까지 전부, 'light' = 합계용 컬럼만 */
const C = { rows: new Map(), state: new Map() };
const last6 = () => Array.from({ length: 6 }, (_, i) => addMonth(S.month, i - 5));
const rowsOf = m => [...C.rows.values()].filter(r => r.month === m).sort((a, b) => String(a.created_at || '').localeCompare(String(b.created_at || '')));

async function ensure(months, level) {
  const need = months.filter(m => level === 'full' ? C.state.get(m) !== 'full' : !C.state.has(m)).sort();
  if (!need.length) return;
  const rows = await S.store.entries(need[0], need.at(-1), level === 'light');
  const set = new Set(need);
  for (const [id, r] of C.rows) if (set.has(r.month)) C.rows.delete(id);
  for (const r of rows) {
    if (!set.has(r.month)) { if (C.state.has(r.month)) C.rows.set(r.id, { ...(C.rows.get(r.id) || {}), ...r }); continue; }
    C.rows.set(r.id, r);
  }
  need.forEach(m => C.state.set(m, level));
}
function putRow(r) {
  if (!r) return;
  if (C.state.has(r.month)) C.rows.set(r.id, { ...(C.rows.get(r.id) || {}), ...r });
  else C.rows.delete(r.id); // 다른 달(아직 안 불러온 달)로 옮겨진 경우
}
function derive() {
  S.entries = rowsOf(S.month);
  S.range = last6().flatMap(rowsOf);
}

/* ───────── 데이터 로드 ───────── */
let lastLoad = 0;
async function load({ force = false, cats = false } = {}) {
  if (force) [S.month, addMonth(S.month, -1)].forEach(m => C.state.delete(m));
  const meta = [];
  if (cats || !S.cats.length) meta.push(S.store.categories().then(c => { S.cats = c; }));
  if (!S.hh) meta.push(S.store.household().then(h => { S.hh = h; }), S.store.members().then(m => { S.members = m; }));
  await Promise.all([...meta, ensure([S.month], 'full'), ensure([addMonth(S.month, -1)], 'light')]);
  if (S.tab === 'trend') await ensure(last6(), 'light');
  derive(); lastLoad = Date.now();
}
async function refresh(opts) { try { await load(opts); render(); } catch (e) { toast(e.message || '불러오기 실패'); } }
let rt;
const renderSoon = () => { clearTimeout(rt); rt = setTimeout(render, 150); };

function onChange(p) {
  if (p.table === 'categories') { clearTimeout(onChange.t); onChange.t = setTimeout(() => refresh({ cats: true }), 300); return; }
  if (p.eventType === 'DELETE') { if (!C.rows.delete(p.old?.id)) return; }
  else putRow(p.new);
  derive(); renderSoon();
}

let unsub = null;
async function start() {
  await refresh({ cats: true });
  unsub?.();
  unsub = S.store.subscribe(onChange);
  // 앱으로 돌아왔을 때: 30초 넘게 지났으면 이번 달·지난달만 다시 확인 (놓친 변경 대비)
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && Date.now() - lastLoad > 30000) refresh({ force: true, cats: true });
  });
}

/* ───────── 렌더 ───────── */
function render() {
  const view = S.tab === 'month' ? viewMonth() : S.tab === 'trend' ? viewTrend() : viewSettings();
  $('#app').innerHTML = `
  <div class="wrap">
    <div class="top">
      ${S.tab === 'settings' ? `<b style="font-size:20px">설정</b>` : `
      <div class="month-nav">
        <button class="ibtn" data-act="prev" aria-label="이전 달">${ICON.left}</button>
        <b class="num">${monthLabel(S.month)}</b>
        <button class="ibtn" data-act="next" aria-label="다음 달">${ICON.right}</button>
      </div>`}
      <div class="hh">${esc(S.hh?.name || '')}${S.store.mode === 'demo' ? '<span class="demo-tag">데모</span>' : ''}</div>
    </div>
    ${view}
  </div>
  ${S.tab === 'settings' ? '' : `<button class="fab" data-act="add" aria-label="지출 추가">${ICON.plus}</button>`}
  <nav class="tabbar"><div class="in">
    ${[['month', '이번 달', ICON.tMonth], ['trend', '추이', ICON.tTrend], ['settings', '설정', ICON.tSet]]
      .map(([k, l, i]) => `<button class="tab ${S.tab === k ? 'on' : ''}" data-act="tab" data-v="${k}">${i}${l}</button>`).join('')}
  </div></nav>`;
}

const memberName = uid => {
  if (!uid) return '';
  const m = S.members.find(x => x.user_id === uid);
  if (!m && !memberName.asked) { memberName.asked = true; S.store.members().then(list => { S.members = list; render(); }).catch(() => {}); }
  return m?.display_name || '';
};
const rowSub = e => {
  const bits = [e.spent_on ? `${+e.spent_on.slice(5, 7)}/${+e.spent_on.slice(8, 10)}` : '', memberName(e.created_by)].filter(Boolean);
  return bits.length ? `<small>${bits.map(esc).join(' · ')}</small>` : '';
};

function viewMonth() {
  const total = sum(S.entries);
  const prev = sum(S.range.filter(e => e.month === addMonth(S.month, -1)));
  const diff = total - prev;
  const byCat = id => S.entries.filter(e => e.category_id === id);
  // 날짜 최신순 → 같은 날은 늦게 입력한 것 먼저, 날짜 없는 항목은 맨 아래
  const byDate = list => [...list].sort((a, b) => (b.spent_on || '').localeCompare(a.spent_on || '') || String(b.created_at || '').localeCompare(String(a.created_at || '')));
  const sortList = list => S.sort === 'amount' ? byDate(list).sort((a, b) => b.amount - a.amount) : byDate(list);
  const fixedIds = new Set(S.cats.filter(c => c.is_fixed).map(c => c.id));
  const prevFixed = S.range.filter(e => e.month === addMonth(S.month, -1) && fixedIds.has(e.category_id));
  const curFixed = S.entries.filter(e => fixedIds.has(e.category_id));
  const showCopy = prevFixed.length && !curFixed.length;

  return `
  <div class="card summary">
    <div class="label">총 지출</div>
    <div class="total num">${won(total)}</div>
    <div class="delta">${prev ? `지난달보다 <span class="${diff > 0 ? 'up' : 'down'} num">${diff > 0 ? '+' : diff < 0 ? '−' : ''}${won(Math.abs(diff))}</span>` : '지난달 기록 없음'}</div>
    ${total ? `<div class="stackbar">${S.cats.map(c => { const v = sum(byCat(c.id)); return v ? `<i style="width:${(v / total) * 100}%;background:${c.color}"></i>` : ''; }).join('')}</div>` : ''}
  </div>
  <div class="sortbar"><span>내역 정렬</span><div class="seg">
    <button class="${S.sort === 'date' ? 'on' : ''}" data-act="sort" data-v="date">날짜순</button>
    <button class="${S.sort === 'amount' ? 'on' : ''}" data-act="sort" data-v="amount">금액순</button>
  </div></div>
  ${showCopy ? `<div class="card banner"><span>지난달 고정지출 ${prevFixed.length}건 (${won(sum(prevFixed))})</span><button data-act="copyfixed">그대로 불러오기</button></div>` : ''}
  ${S.cats.map(c => {
    const list = sortList(byCat(c.id)), v = sum(list), open = S.open.has(c.id);
    return `
    <div class="card cat ${open ? 'open' : ''}">
      <button class="cat-head" data-act="toggle" data-id="${c.id}">
        <span class="dot" style="background:${c.color}"></span>
        <span class="cat-name"><span>${esc(c.name)}</span>${c.is_fixed ? '<em class="badge">고정</em>' : ''}</span>
        <span class="cat-sum num ${v ? '' : 'zero'}">${won(v)}</span>${ICON.chev}
      </button>
      ${open ? `<div class="cat-body">
        ${list.length ? list.map(e => `
          <button class="row" data-act="edit" data-id="${e.id}">
            <span class="m"><div>${esc(e.memo || c.name)}</div>${rowSub(e)}</span>
            <span class="num">${won(e.amount)}</span>
          </button>`).join('') : `<div class="empty">아직 기록이 없어요</div>`}
        <button class="add-in" data-act="add" data-cat="${c.id}">+ ${esc(c.name)} 추가</button>
      </div>` : ''}
    </div>`;
  }).join('')}
  ${S.cats.length ? '' : `<div class="note">카테고리가 없어요. 설정에서 추가하세요.</div>`}`;
}

function viewTrend() {
  const months = Array.from({ length: 6 }, (_, i) => addMonth(S.month, i - 5));
  const totals = months.map(m => sum(S.range.filter(e => e.month === m)));
  const max = Math.max(1, ...totals);
  const catSum = (cid, m) => sum(S.range.filter(e => e.month === m && e.category_id === cid));
  const active = months.filter((m, i) => totals[i] > 0);
  return `
  <div class="card chart">
    <div class="label" style="font-size:13px;color:var(--sub)">최근 6개월 지출</div>
    <div class="bars">
      ${months.map((m, i) => `
      <div class="bar ${m === S.month ? 'cur' : ''}">
        <span class="v num">${totals[i] ? compact(totals[i]) : ''}</span>
        <div class="stack" style="height:${(totals[i] / max) * 100}%">
          ${S.cats.map(c => { const v = catSum(c.id, m); return v ? `<i style="display:block;height:${(v / totals[i]) * 100}%;background:${c.color}"></i>` : ''; }).join('')}
        </div>
        <small>${shortMonth(m)}</small>
      </div>`).join('')}
    </div>
    <div class="legend">${S.cats.map(c => `<span><span class="dot" style="background:${c.color};width:8px;height:8px"></span>${esc(c.name)}</span>`).join('')}</div>
  </div>
  <div class="card" style="overflow:hidden">
    <table>
      <tr><th>카테고리</th><th>${shortMonth(S.month)}</th><th>월평균${active.length ? ` (${active.length}개월)` : ''}</th></tr>
      ${S.cats.map(c => {
        const avg = active.length ? Math.round(active.reduce((a, m) => a + catSum(c.id, m), 0) / active.length) : 0;
        return `<tr><td><span class="dot" style="background:${c.color};display:inline-block;margin-right:8px"></span>${esc(c.name)}</td><td class="num">${won(catSum(c.id, S.month))}</td><td class="num" style="color:var(--sub)">${won(avg)}</td></tr>`;
      }).join('')}
      <tr><td><b>합계</b></td><td class="num"><b>${won(totals[5])}</b></td><td class="num" style="color:var(--sub)">${won(active.length ? Math.round(totals.reduce((a, b) => a + b, 0) / active.length) : 0)}</td></tr>
    </table>
  </div>`;
}

function viewSettings() {
  const demo = S.store.mode === 'demo';
  return `
  ${demo ? `<div class="card" style="padding:14px 16px;font-size:14px">
    지금은 <b>데모 모드</b>라 이 기기에만 저장돼요. <code>config.js</code>에 Supabase 주소와 키를 넣으면 둘이 공유하는 모드로 바뀌어요.
  </div>` : ''}
  <div class="sec">가계부</div>
  <div class="card">
    <button class="srow" data-act="rename"><span class="grow">이름</span><span class="val">${esc(S.hh?.name)}</span></button>
    ${demo ? '' : `
    <button class="srow" data-act="copycode"><span class="grow">초대코드<div class="note" style="margin:2px 0 0;padding:0">상대방이 가입 후 이 코드로 참여해요</div></span><span class="code">${esc(S.hh?.invite_code)}</span></button>
    <div class="srow"><span class="grow">구성원</span><span class="val">${S.members.map(m => esc(m.display_name)).join(', ')}</span></div>`}
  </div>

  <div class="sec">카테고리</div>
  <div class="card">
    ${S.cats.map((c, i) => `
    <div class="srow">
      <span class="dot" style="background:${c.color}"></span>
      <button class="grow" style="text-align:left" data-act="editcat" data-id="${c.id}">${esc(c.name)} ${c.is_fixed ? '<em class="badge">고정</em>' : ''}</button>
      <button class="mini" data-act="move" data-id="${c.id}" data-d="-1" ${i === 0 ? 'disabled' : ''} aria-label="위로">${ICON.up}</button>
      <button class="mini" data-act="move" data-id="${c.id}" data-d="1" ${i === S.cats.length - 1 ? 'disabled' : ''} aria-label="아래로">${ICON.down}</button>
    </div>`).join('')}
    <button class="srow link" data-act="newcat">+ 카테고리 추가</button>
  </div>
  <p class="note">카테고리를 누르면 이름·색·고정지출 여부를 바꾸거나 삭제할 수 있어요.</p>

  <div class="sec">데이터</div>
  <div class="card">
    <button class="srow" data-act="csv"><span class="grow">전체 내역 CSV로 내보내기</span></button>
    ${demo ? `<button class="srow danger" data-act="reset"><span class="grow">데모 데이터 초기화</span></button>`
           : `<button class="srow danger" data-act="logout"><span class="grow">로그아웃</span><span class="val">${esc(S.user?.email)}</span></button>`}
  </div>`;
}

/* ───────── 시트 (하단 팝업) ───────── */
function openSheet(html, mount) {
  closeSheet(true);
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  const sheet = document.createElement('div'); sheet.className = 'sheet'; sheet.innerHTML = `<div class="grab"></div>${html}`;
  document.body.append(scrim, sheet);
  requestAnimationFrame(() => { scrim.classList.add('show'); sheet.classList.add('show'); });
  scrim.onclick = () => closeSheet();
  mount?.(sheet);
}
function closeSheet(instant) {
  document.querySelectorAll('.scrim,.sheet').forEach(el => {
    if (instant) return el.remove();
    el.classList.remove('show'); setTimeout(() => el.remove(), 220);
  });
}

function entrySheet(entry, presetCat) {
  const isNew = !entry;
  let cat = entry?.category_id || presetCat || (S.cats.find(c => !c.is_fixed) || S.cats[0])?.id;
  if (!S.cats.length) { toast('먼저 카테고리를 추가하세요'); return; }
  const defDate = entry ? (entry.spent_on || '') : (S.month === ym(new Date()) ? today() : '');
  openSheet(`
    <h3>${isNew ? '지출 추가' : '지출 수정'} <span style="font-weight:400;color:var(--sub);font-size:14px">· ${monthLabel(S.month)}</span></h3>
    <div class="field">
      <input class="inp amount num" id="amt" inputmode="numeric" placeholder="0" value="${entry ? Number(entry.amount).toLocaleString('ko-KR') : ''}" autocomplete="off">
      <div class="quick"><button data-q="10000">+1만</button><button data-q="50000">+5만</button><button data-q="100000">+10만</button><button data-q="0">지우기</button></div>
    </div>
    <div class="field"><label>카테고리</label><div class="chips" id="chips">
      ${S.cats.map(c => `<button class="chip ${c.id === cat ? 'on' : ''}" data-c="${c.id}"><span class="dot" style="background:${c.color};width:8px;height:8px"></span>${esc(c.name)}</button>`).join('')}
    </div></div>
    <div class="field"><label>메모</label><input class="inp" id="memo" placeholder="예: 관리비, 장보기" value="${esc(entry?.memo || '')}"></div>
    <div class="field"><label>날짜 (선택)</label><input class="inp" id="date" type="date" value="${defDate}"></div>
    <div class="actions">
      ${isNew ? '' : '<button class="btn del" id="del">삭제</button>'}
      <button class="btn primary" id="save">${isNew ? '추가' : '저장'}</button>
    </div>`, sh => {
    const amt = sh.querySelector('#amt');
    const val = () => Number(amt.value.replace(/[^\d]/g, '')) || 0;
    const fmt = n => { amt.value = n ? n.toLocaleString('ko-KR') : ''; };
    amt.addEventListener('input', () => fmt(val()));
    sh.querySelectorAll('[data-q]').forEach(b => b.onclick = () => fmt(+b.dataset.q ? val() + +b.dataset.q : 0));
    sh.querySelector('#chips').onclick = e => {
      const b = e.target.closest('[data-c]'); if (!b) return;
      cat = b.dataset.c; sh.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b));
    };
    if (isNew) setTimeout(() => amt.focus(), 250);
    sh.querySelector('#save').onclick = async (ev) => {
      const amount = val();
      if (!amount) { toast('금액을 입력하세요'); return; }
      const spent_on = sh.querySelector('#date').value || null;
      const row = { category_id: cat, amount, memo: sh.querySelector('#memo').value.trim(), spent_on, month: spent_on ? spent_on.slice(0, 7) : (entry?.month || S.month) };
      ev.target.disabled = true;
      try {
        putRow(isNew ? await S.store.addEntry(row) : await S.store.updateEntry(entry.id, row));
        S.open.add(cat); closeSheet(); derive(); render();
        if (row.month !== S.month) toast(`${monthLabel(row.month)}에 저장했어요`);
      } catch (e) { toast(e.message); ev.target.disabled = false; }
    };
    sh.querySelector('#del')?.addEventListener('click', async () => {
      if (!confirm('이 지출을 삭제할까요?')) return;
      try { await S.store.deleteEntry(entry.id); C.rows.delete(entry.id); closeSheet(); derive(); render(); } catch (e) { toast(e.message); }
    });
  });
}

function catSheet(c) {
  const isNew = !c;
  let color = c?.color || SWATCHES.find(s => !S.cats.some(x => x.color === s)) || SWATCHES[0];
  openSheet(`
    <h3>${isNew ? '카테고리 추가' : '카테고리 편집'}</h3>
    <div class="field"><label>이름</label><input class="inp" id="nm" value="${esc(c?.name || '')}" placeholder="예: 경조사비"></div>
    <div class="field"><label>색</label><div class="swatches" id="sws">
      ${SWATCHES.map(s => `<button class="sw ${s === color ? 'on' : ''}" data-s="${s}" style="background:${s}" aria-label="${s}"></button>`).join('')}
    </div></div>
    <div class="field"><label class="toggle"><span>고정지출<small>매달 같은 금액 — 지난달 내역을 한 번에 불러올 수 있어요</small></span><input type="checkbox" id="fx" ${c?.is_fixed ? 'checked' : ''}></label></div>
    <div class="actions">
      ${isNew ? '' : '<button class="btn del" id="del">삭제</button>'}
      <button class="btn primary" id="save">${isNew ? '추가' : '저장'}</button>
    </div>`, sh => {
    sh.querySelector('#sws').onclick = e => {
      const b = e.target.closest('[data-s]'); if (!b) return;
      color = b.dataset.s; sh.querySelectorAll('.sw').forEach(x => x.classList.toggle('on', x === b));
    };
    if (isNew) setTimeout(() => sh.querySelector('#nm').focus(), 250);
    sh.querySelector('#save').onclick = async () => {
      const name = sh.querySelector('#nm').value.trim();
      if (!name) { toast('이름을 입력하세요'); return; }
      const p = { name, color, is_fixed: sh.querySelector('#fx').checked };
      try { isNew ? await S.store.addCategory(p) : await S.store.updateCategory(c.id, p); closeSheet(); await refresh({ cats: true }); } catch (e) { toast(e.message); }
    };
    sh.querySelector('#del')?.addEventListener('click', async () => {
      if (!confirm(`'${c.name}' 카테고리를 삭제할까요?\n이 카테고리의 모든 달 기록도 함께 삭제돼요.`)) return;
      try {
        await S.store.deleteCategory(c.id);
        for (const [id, r] of C.rows) if (r.category_id === c.id) C.rows.delete(id);
        closeSheet(); await refresh({ cats: true });
      } catch (e) { toast(e.message); }
    });
  });
}

/* ───────── 액션 ───────── */
const ACT = {
  tab: async b => {
    S.tab = b.dataset.v; window.scrollTo(0, 0);
    if (S.tab === 'trend') return refresh(); // 추이 탭을 열 때만 6개월치 합계용 데이터 로드
    if (S.tab === 'settings' && S.store.mode === 'cloud') S.store.members().then(m => { S.members = m; if (S.tab === 'settings') render(); }).catch(() => {});
    render();
  },
  prev: async () => { S.month = addMonth(S.month, -1); S.open.clear(); await refresh(); },
  next: async () => { S.month = addMonth(S.month, 1); S.open.clear(); await refresh(); },
  sort: b => { S.sort = b.dataset.v; try { localStorage.setItem('fb-sort', S.sort); } catch (_) {} render(); },
  toggle: b => { const id = b.dataset.id; S.open.has(id) ? S.open.delete(id) : S.open.add(id); render(); },
  add: b => entrySheet(null, b.dataset.cat),
  edit: b => entrySheet(S.entries.find(e => e.id === b.dataset.id)),
  newcat: () => catSheet(null),
  editcat: b => catSheet(S.cats.find(c => c.id === b.dataset.id)),
  move: async b => {
    const i = S.cats.findIndex(c => c.id === b.dataset.id), j = i + +b.dataset.d;
    if (j < 0 || j >= S.cats.length) return;
    const list = [...S.cats]; [list[i], list[j]] = [list[j], list[i]];
    try { await Promise.all(list.map((c, k) => c.sort_order !== k ? S.store.updateCategory(c.id, { sort_order: k }) : null)); await refresh({ cats: true }); } catch (e) { toast(e.message); }
  },
  copyfixed: async () => {
    const fixedIds = new Set(S.cats.filter(c => c.is_fixed).map(c => c.id));
    try {
      await ensure([addMonth(S.month, -1)], 'full'); // 메모까지 필요하니 지난달 전체 로드
      const prev = rowsOf(addMonth(S.month, -1)).filter(e => fixedIds.has(e.category_id));
      const added = await S.store.addEntries(prev.map(e => ({ category_id: e.category_id, amount: e.amount, memo: e.memo || '', month: S.month, spent_on: null })));
      added.forEach(putRow);
      prev.forEach(e => S.open.add(e.category_id));
      derive(); render(); toast(`고정지출 ${prev.length}건을 불러왔어요`);
    } catch (e) { toast(e.message); }
  },
  rename: async () => {
    const name = prompt('가계부 이름', S.hh?.name || ''); if (!name?.trim()) return;
    try { await S.store.renameHousehold(name.trim()); S.hh = { ...S.hh, name: name.trim() }; render(); } catch (e) { toast(e.message); }
  },
  copycode: async () => { try { await navigator.clipboard.writeText(S.hh.invite_code); toast('초대코드를 복사했어요'); } catch (_) { toast(S.hh.invite_code); } },
  csv: async () => {
    try {
      const all = await S.store.entries('0000-00', '9999-99');
      const name = Object.fromEntries(S.cats.map(c => [c.id, c.name]));
      const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
      const rows = [['월', '날짜', '카테고리', '금액', '메모'], ...all.sort((a, b) => a.month.localeCompare(b.month))
        .map(e => [e.month, e.spent_on || '', name[e.category_id] || '', e.amount, e.memo || ''])];
      const blob = new Blob(['﻿' + rows.map(r => r.map(q).join(',')).join('\n')], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `가계부_${ym(new Date())}.csv`; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    } catch (e) { toast(e.message); }
  },
  reset: async () => { if (!confirm('데모 데이터를 모두 지우고 기본 카테고리만 남길까요?')) return; await S.store.reset(); S.open.clear(); C.rows.clear(); C.state.clear(); await refresh({ cats: true }); toast('초기화했어요'); },
  logout: async () => { if (!confirm('로그아웃할까요?')) return; unsub?.(); await S.sb.auth.signOut(); S.store = null; S.hh = null; S.cats = []; C.rows.clear(); C.state.clear(); renderAuth(); },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  ACT[b.dataset.act]?.(b);
});

/* ───────── 서비스워커 (홈 화면 앱) ───────── */
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

boot();
</script>
</body>
</html>
